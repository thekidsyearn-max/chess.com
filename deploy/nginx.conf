# Rookery — Nginx server block for macOS (Homebrew, Apple Silicon)
#
# Install:  scripts/setup.sh --nginx     (renders the placeholders and copies this file to
#           /opt/homebrew/etc/nginx/servers/chess.conf, then reloads Nginx)
# Manual:   replace __PROJECT_ROOT__ and __SERVER_NAME__, copy to that path, then
#           nginx -t && brew services restart nginx
#
# Homebrew's stock nginx.conf already has `include servers/*;` inside its http {} block.
# Nginx serves every static file straight from disk (sendfile), so the Node process
# spends no memory or CPU on assets; only /api/, /ws and the HTML shell are proxied.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# keep the scheme Cloudflare saw (https) when the tunnel hands us plain HTTP
map $http_x_forwarded_proto $rookery_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream rookery_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    # macOS lets an unprivileged Nginx bind port 80 on the wildcard address.
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__ localhost 127.0.0.1;

    # cloudflared connects from loopback; drop these three lines to allow devices on your LAN.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    root __PROJECT_ROOT__/public;
    server_tokens off;
    client_max_body_size 1m;

    # the real visitor address arrives in CF-Connecting-IP
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml audio/wav audio/x-wav application/x-chess-pgn;

    # Brotli needs the ngx_brotli module, which Homebrew's nginx does not ship.
    # If you build with it, uncomment:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- static assets: served from disk, cached for 30 days ---------------------------------
    # The HTML shell references /assets/v/<build-id>/..., so "immutable" is safe: a new build
    # changes the URL.
    location ~ ^/assets/v/[^/]+/(.*)$ {
        alias __PROJECT_ROOT__/public/assets/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location /pieces/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location /sounds/ {
        # stock mime.types has no entry for WAV
        types { audio/wav wav; }
        default_type audio/wav;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location ~ ^/(favicon\.svg|robots\.txt)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- WebSocket ------------------------------------------------------------------------------
    location = /ws {
        proxy_pass http://rookery_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rookery_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ---- REST API -------------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://rookery_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rookery_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 5s;
    }

    # ---- everything else is the single-page app shell (a few kB, rendered by Node) ---------------
    location / {
        proxy_pass http://rookery_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rookery_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }
}
